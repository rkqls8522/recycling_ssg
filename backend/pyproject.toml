[project]
name = "backend"
version = "0.1.0"
description = "Backend API for recycling_ssg"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bcrypt>=4.2.0",
    "boto3>=1.35.0",
    "email-validator>=2.2.0",
    "fastapi>=0.141.1",
    "google-genai>=1.0.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10.0",
    "pymysql>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff.lint]
# B008 (function-call-in-default-argument) flags FastAPI's canonical
# Depends()/File()/Query()/Path()/Header() dependency-injection pattern,
# which is required, not a bug -- ignore it repo-wide instead of littering
# every route with a noqa.
ignore = ["B008"]
