[project]
name = "backend"
version = "0.1.0"
description = "Backend API for recycling_ssg"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
