[project]
name = "recycling-ssg"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langchain-core>=1.6.2",
    "langchain-google-genai>=4.4.0",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-pinecone>=0.2.13",
    "langchain-upstage>=0.7.7",
    "langgraph>=1.2.11",
    "langsmith>=0.12.2",
    "python-dotenv>=1.2.3",
]

[tool.uv]
package = false
required-version = ">=0.12.9,<0.13"

[tool.uv.workspace]
members = [
    "backend",
]
