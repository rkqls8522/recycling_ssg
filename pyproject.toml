[project]
name = "recycling-ssg"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pyyaml>=6.0.3",
    "ultralytics>=8.4.138",
]

[tool.uv]
package = false
required-version = ">=0.12.9,<0.13"

[tool.uv.workspace]
members = [
    "backend",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
